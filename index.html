<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Rebate Tracker</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/file-saver/dist/FileSaver.min.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>Rebate Tracker</h1><p>Programs, sales and supplier reports</p></div>
    <button id="logout" class="ghost hidden">Sign out</button>
  </header>

  <section id="auth" class="card">
    <h2>Sign in</h2>
    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <div class="row"><button id="login">Sign in</button><button id="signup" class="ghost">Create account</button></div>
    <p id="msg"></p>
  </section>

  <main id="app" class="hidden">
    <section class="card toolbar">
      <select id="period"></select>
      <div class="row">
        <button id="newPeriod" class="ghost">New Period</button>
        <button id="newProgram">Add Program</button>
        <button id="export" class="ghost">Export Excel</button>
      </div>
    </section>

    <section class="stats">
      <div class="card"><small>Programs</small><strong id="sPrograms">0</strong></div>
      <div class="card"><small>Qty Sold</small><strong id="sQty">0</strong></div>
      <div class="card"><small>Sales Total</small><strong id="sSales">$0.00</strong></div>
      <div class="card"><small>Rebate Due</small><strong id="sRebate">$0.00</strong></div>
    </section>

    <section class="card">
      <div class="tablewrap"><table>
        <thead><tr>
          <th>PLU</th><th>Description</th><th>Size</th><th>Scan Program</th><th>Rebate</th>
          <th>Start</th><th>End</th><th>Units Req.</th><th>Qty Sold</th><th>Rebate Qualified</th><th>Item Price</th>
          <th>Sales Total</th><th>Qualifying Rebates</th><th>Rebate Due</th><th></th>
        </tr></thead>
        <tbody id="body"></tbody>
      </table></div>
    </section>
  </main>
</div>

<dialog id="periodDlg">
<form method="dialog">
  <h3>New rebate period</h3>
  <label>Period Name
    <input id="periodName" placeholder="Example: August 2026">
  </label>
  <div class="grid">
    <label>Start Date
      <input id="periodStart" type="date">
    </label>
    <label>End Date
      <input id="periodEnd" type="date">
    </label>
  </div>
  <div class="row"><button value="cancel" class="ghost">Cancel</button><button id="savePeriod">Save</button></div>
</form>
</dialog>

<dialog id="programDlg">
<form method="dialog">
  <h3 id="programTitle">Add rebate program</h3>
  <input id="programId" type="hidden">
  <div class="grid">
    <label>PLU
      <input id="plu">
    </label>
    <label>Description
      <input id="desc">
    </label>
    <label>Size / Pack
      <input id="size">
    </label>
    <label>Rebate Amount ($)
      <input id="rebate" type="number" step="0.01" min="0" value="0">
    </label>
    <label>Start Date
      <input id="start" type="date">
    </label>
    <label>End Date
      <input id="end" type="date">
    </label>
    <label>Units Required per Rebate
      <input id="units" type="number" min="1" value="1">
    </label>
    <label>Qty Sold
      <input id="qty" type="number" min="0" value="0">
    </label>
    <label>Rebate Qualified Qty
      <input id="rebateQualified" type="number" min="0" value="0">
    </label>
    <label>Item Price ($)
      <input id="price" type="number" step="0.01" min="0" value="0">
    </label>
  </div>
  <label>Scan Program
    <textarea id="scan" rows="3"></textarea>
  </label>
  <label>Notes
    <textarea id="notes" rows="2"></textarea>
  </label>
  <div class="row"><button value="cancel" class="ghost">Cancel</button><button id="saveProgram">Save Program</button></div>
</form>
</dialog>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
